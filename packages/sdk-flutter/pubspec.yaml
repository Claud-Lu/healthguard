name: healthguard_flutter
version: 0.3.0
description: Privacy-preserving HealthGuard client with Dio and Android network diagnostics.
homepage: https://github.com/Claud-Lu/healthguard
repository: https://github.com/Claud-Lu/healthguard/tree/master/packages/sdk-flutter
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  shared_preferences: '>=2.2.3 <2.3.0'
  # Keep Android 5 / API 21 compatibility; later releases raise minSdk.
  shared_preferences_android: '>=2.4.11 <2.4.12'
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.healthguard.flutter
        pluginClass: HealthGuardPlugin
